name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit

  build:
    name: build
    runs-on: ubuntu-latest
        env:
              YANDEX_VERIFICATION: ${{ secrets.YANDEX_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build Docusaurus
        run: npm run build
      - name: Verify build output
        run: test -f build/index.html
