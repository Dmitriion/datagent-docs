# Fallback: обновить ветку gh-pages вручную, если Source = Branch gh-pages / (root).
# Не запускать при Source = GitHub Actions — иначе конфликт с deploy.yml (два деплоя в github-pages).
name: Publish gh-pages branch (fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: test -f build/index.html && ! grep -q "Локальный запуск" build/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
          cname: docs.datagent.ru
