<svg xmlns='http://www.w3.org/2000/svg' width='960' height='420' viewBox='0 0 960 420' role='img' aria-labelledby='timeline-title timeline-desc'>
<title id='timeline-title'>Таймлайн запусков агентов за семь дней</title><desc id='timeline-desc'>Строки агентов, полосы запусков, кластер коротких запусков и мини-карта периода.</desc><rect width='960' height='420' fill='#0f172a'/><rect x='24' y='20' width='912' height='44' rx='8' fill='#1e293b'/><text x='40' y='48' fill='#e2e8f0' font-family='Segoe UI, Arial, sans-serif' font-size='17' font-weight='600'>Таймлайн · 7 дней</text><text x='720' y='48' fill='#94a3b8' font-family='Segoe UI, Arial, sans-serif' font-size='13'>Сегодня · 7 дней · 30 дней</text><g font-family='Segoe UI, Arial, sans-serif' font-size='12' fill='#94a3b8'><text x='200' y='92'>Пн</text><text x='320' y='92'>Вт</text><text x='440' y='92'>Ср</text><text x='560' y='92'>Чт</text><text x='680' y='92'>Пт</text><text x='800' y='92'>Сб</text><text x='900' y='92'>Вс</text></g><line x1='180' y1='100' x2='936' y2='100' stroke='#334155'/>
<g font-family='Segoe UI, Arial, sans-serif'><text x='32' y='148' fill='#cbd5e1' font-size='14'>Помощник CRM</text><rect x='220' y='128' width='140' height='28' rx='6' fill='#2563eb'/><rect x='420' y='128' width='90' height='28' rx='6' fill='#2563eb'/><rect x='620' y='128' width='160' height='28' rx='6' fill='#1d4ed8'/><text x='32' y='208' fill='#cbd5e1' font-size='14'>Аналитик 1С</text><rect x='260' y='188' width='200' height='28' rx='6' fill='#0d9488'/><rect x='540' y='188' width='70' height='28' rx='6' fill='#334155' stroke='#94a3b8' stroke-dasharray='4 3'/><text x='556' y='207' fill='#e2e8f0' font-size='12'>+3</text><text x='32' y='268' fill='#cbd5e1' font-size='14'>Редактор</text><rect x='300' y='248' width='110' height='28' rx='6' fill='#7c3aed'/><rect x='700' y='248' width='130' height='28' rx='6' fill='#7c3aed'/></g><line x1='780' y1='100' x2='780' y2='300' stroke='#f59e0b' stroke-dasharray='3 4'/><text x='786' y='118' fill='#fbbf24' font-family='Segoe UI, Arial, sans-serif' font-size='11'>сейчас</text><rect x='24' y='320' width='912' height='76' rx='10' fill='#1e293b'/><text x='40' y='350' fill='#94a3b8' font-family='Segoe UI, Arial, sans-serif' font-size='13'>Мини-карта периода</text><rect x='40' y='364' width='880' height='16' rx='4' fill='#334155'/><rect x='280' y='364' width='260' height='16' rx='4' fill='#475569'/><text x='40' y='400' fill='#94a3b8' font-family='Segoe UI, Arial, sans-serif' font-size='12'>Клик по полосе открывает задачу · кластер +N раскрывает плотные запуски</text></svg>
